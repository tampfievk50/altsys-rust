[workspace]
members = [
    "sdlc-container",
    "sdlc-application",
    "sdlc-domain",
    "sdlc-dataaccess",
    "migration",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
sea-orm = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros", "with-chrono", "with-uuid"] }
sea-orm-migration = { version = "1.1", features = ["sqlx-postgres", "runtime-tokio-rustls"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
async-trait = "0.1"
dotenvy = "0.15"
jsonwebtoken = "9"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
aes-gcm = "0.10"
base64 = "0.22"
rig-core = "0.38"
futures = "0.3"
# Only PluginHttpDispatcher (automation's webhook dispatch to genuinely
# external third-party systems) still needs this — every other
# cross-service call in this merged workspace is now in-process.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
